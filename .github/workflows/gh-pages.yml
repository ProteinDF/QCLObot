name: github pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r doc/requirements.txt

      - name: Build HTML (English + Japanese)
        run: |
          cd doc
          make html

      - uses: actions/upload-artifact@v4
        with:
          name: html-site
          path: doc/_build/html

  pdf:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r doc/requirements.txt

      - name: Install TeX (English + Japanese)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-extra texlive-fonts-recommended \
            texlive-lang-japanese fonts-ipaexfont

      - name: Build PDFs
        run: |
          cd doc
          make latexpdf_en
          make latexpdf_ja

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-site
          path: |
            doc/_build/latex/en/*.pdf
            doc/_build/latex/ja/*.pdf

  deploy:
    needs: [html, pdf]
    if: always() && needs.html.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: html-site
          path: _site

      - uses: actions/download-artifact@v4
        if: needs.pdf.result == 'success'
        with:
          name: pdf-site
          path: _site/pdf
        continue-on-error: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
